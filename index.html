<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutown Grooove</title>
<meta name="theme-color" content="#12071f">
<link rel="apple-touch-icon" href="./cover.jpg">
<style>
  :root{
    --pink:#ff5fa2; --purple:#a06bff; --yellow:#ffe94a; --cyan:#5ce1ff;
    --txt:#fff7ff; --dim:rgba(255,247,255,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--txt);overflow-x:hidden;
    font:16px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#12071f;
    -webkit-user-select:none;user-select:none;
  }
  /* 背景：封面放大 + 高斯模糊（毛玻璃底） */
  .bg{position:fixed;inset:-12%;z-index:0;
      background:url('./cover.jpg') center/cover no-repeat;
      filter:blur(56px) saturate(1.5) brightness(.55);transform:scale(1.25)}
  .bg::after{content:'';position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(18,7,31,.35),rgba(18,7,31,.82) 62%,#12071f)}

  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 20px 34px;
        display:flex;flex-direction:column;min-height:100vh}

  /* 顶栏 */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .top .t1{font-size:12.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}

  /* 封面（2026-09-18 毛毛定稿：只要一张圆封面 —— 黑胶纹路不要、中心孔也不要；播放时整张圆盘慢慢转） */
  .cover{position:relative;margin:10px auto 22px;width:74vw;max-width:290px;aspect-ratio:1/1;
         border-radius:50%;overflow:hidden;
         box-shadow:0 26px 60px -16px rgba(255,95,162,.6), 0 10px 30px rgba(0,0,0,.55),
                    inset 0 0 0 1px rgba(255,255,255,.14)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  /* 常驻旋转动画：用 animation-play-state 控制启停 —— 暂停时角度保留，
     切歌不会「转回原点」（2026-09-18 毛毛要求：切歌要接着转，别恢复原状） */
  .cover .disc{width:100%;height:100%;border-radius:50%;overflow:hidden;
     animation:sp 20s linear infinite;animation-play-state:paused}
  .cover.playing .disc{animation-play-state:running}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 歌名 */
  .meta{text-align:center;margin-bottom:18px}
  .song{font-size:23px;font-weight:800;letter-spacing:.3px;
        text-shadow:0 2px 18px rgba(255,95,162,.45);margin-bottom:3px}
  .artist{font-size:13.5px;color:var(--dim);letter-spacing:.5px}
  .album{font-size:11.5px;color:rgba(255,247,255,.4);margin-top:2px;letter-spacing:1px}

  /* 进度条 */
  .prog{margin:6px 0 20px}
  .bar{position:relative;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .bar .track{position:absolute;left:0;right:0;height:5px;border-radius:99px;
      background:rgba(255,255,255,.16);overflow:hidden}
  .bar .fill{height:100%;width:0%;
      background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));border-radius:99px}
  .bar .knob{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;
      box-shadow:0 0 12px var(--pink);transform:translateX(-50%);left:0;opacity:0;transition:opacity .2s}
  .bar:hover .knob,.bar.active .knob{opacity:1}
  .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:1px;
      font-variant-numeric:tabular-nums}

  /* 控制区 */
  .ctrl{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:18px}
  .btn{background:none;border:0;color:var(--txt);padding:8px;display:flex;align-items:center;
       justify-content:center;border-radius:50%;transition:transform .12s}
  .btn:active{transform:scale(.9)}
  .btn svg{width:27px;height:27px;fill:currentColor}
  .btn.main{width:68px;height:68px;background:linear-gradient(135deg,var(--pink),var(--purple));
      box-shadow:0 12px 30px -8px var(--pink);color:#2a0a1c}
  .btn.main svg{width:31px;height:31px}
  .btn.sm svg{width:22px;height:22px;opacity:.85}

  /* 底部：模式 + 列表 */
  .foot{display:flex;gap:10px;margin-top:auto;padding-top:6px}
  .chip{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
        color:var(--txt);border-radius:13px;padding:11px 12px;font-size:13.5px;font-weight:600;
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;
        align-items:center;justify-content:center;gap:7px}
  .chip:active{background:rgba(255,255,255,.13)}

  /* 列表面板 */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:76vh;overflow-y:auto;
     background:rgba(24,10,40,.93);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
     border-top-left-radius:24px;border-top-right-radius:24px;
     border-top:1px solid rgba(255,255,255,.14);padding:16px 18px 30px;
     transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .sheet.open{transform:translateY(0)}
  .sheet h3{margin:4px 0 12px;font-size:15px;letter-spacing:1px;color:var(--dim);font-weight:600}
  .row{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:12px;margin-bottom:3px}
  .row.on{background:linear-gradient(90deg,rgba(255,95,162,.24),rgba(160,107,255,.12))}
  .row .no{width:22px;text-align:center;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .row.on .no{color:var(--pink);font-weight:800}
  .row .nm{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .who{font-size:11.5px;color:var(--dim);margin-top:1px}
  .row .dl{margin-left:9px;width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;
     justify-content:center;border-radius:50%;background:rgba(255,255,255,.09);
     font-size:13px;color:var(--txt);border:1px solid rgba(255,255,255,.1)}
  .row .dl.on{background:rgba(92,225,255,.18);color:var(--cyan);border-color:rgba(92,225,255,.4);font-weight:800}
  .row .dl.part{background:rgba(255,138,61,.16);color:#ff8a3d;border-color:rgba(255,138,61,.4)}
  .row .dl:active{background:rgba(255,255,255,.22)}
  .row .eq{display:flex;gap:2px;align-items:flex-end;height:13px}
  .row .eq i{width:2.5px;background:var(--pink);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .row .eq i:nth-child(2){animation-delay:.15s}.row .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{0%,100%{height:4px}50%{height:13px}}
  /* 播放模式面板（2026-09-18 毛毛要求：随机 / 顺序 / 单曲要一眼能选到，不再只能循环盲切） */
  .modepanel{position:fixed;left:0;right:0;bottom:0;z-index:6;
     background:rgba(24,10,40,.96);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
     border-top-left-radius:24px;border-top-right-radius:24px;
     border-top:1px solid rgba(255,255,255,.14);padding:16px 18px 30px;
     transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .modepanel.open{transform:translateY(0)}
  .modepanel h3{margin:4px 0 12px;font-size:15px;letter-spacing:1px;color:var(--dim);font-weight:600}
  .mrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;
     margin-bottom:8px;font-size:14.5px;background:rgba(255,255,255,.06);
     border:1px solid rgba(255,255,255,.09)}
  .mrow:active{background:rgba(255,255,255,.14)}
  .mrow .mk{font-size:17px;width:24px;text-align:center}
  .mrow .mck{margin-left:auto;color:var(--pink);font-weight:800;opacity:0;transition:opacity .2s}
  .mrow.on{background:linear-gradient(90deg,rgba(255,95,162,.24),rgba(160,107,255,.12));
     border-color:rgba(255,95,162,.4)}
  .mrow.on .mck{opacity:1}
  .mask{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;
        transition:opacity .3s}
  .mask.on{opacity:1;pointer-events:auto}
  .hint{text-align:center;font-size:11.5px;color:rgba(255,247,255,.42);margin-top:12px;line-height:1.6}
  .sheet .cta{width:100%;margin-top:10px;background:rgba(255,255,255,.09);
     border:1px solid rgba(255,255,255,.15);color:var(--txt);border-radius:12px;padding:12px;
     font-size:13.5px;font-weight:600}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="top">
    <div class="t1">Mutown Grooove</div>
  </div>

  <div class="cover" id="cover"><div class="disc"><img src="./cover.jpg" alt="cover"></div></div>

  <div class="meta">
    <div class="song" id="song">见习恶魔</div>
    <div class="artist" id="artist">Buro</div>
    <div class="album" id="album">MUSE DASH ORIGINAL SONG ALBUM</div>
  </div>

  <div class="prog">
    <div class="bar" id="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="ctrl">
    <button class="btn sm" id="modeBtn" title="播放模式">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
    <button class="btn" id="prev" title="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn main" id="play" title="播放/暂停">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>
    </button>
    <button class="btn" id="next" title="下一首">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
    <button class="btn sm" id="listBtn" title="播放列表">
      <svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-9l4 4-4 4v-8z"/></svg>
    </button>
  </div>

  <div class="foot">
    <button class="chip" id="modeChip">🔁 列表循环</button>
    <button class="chip" id="listChip">☰ 播放列表</button>
  </div>
  <p class="hint" id="tip">贴一下 NFC 挂件打开本页 · 点 ▶ 开播 · 放完自动下一首</p>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>播放列表 · 10 首</h3>
  <div id="rows"></div>
</div>

<!-- 播放模式选择面板（点模式按钮或底部「模式」标签弹出） -->
<div class="modepanel" id="modePanel">
  <h3>播放模式</h3>
  <div class="mrow" data-m="order"><span class="mk">➡️</span>顺序播放<span class="mck">✓</span></div>
  <div class="mrow" data-m="all"><span class="mk">🔁</span>列表循环<span class="mck">✓</span></div>
  <div class="mrow" data-m="one"><span class="mk">🔂</span>单曲循环<span class="mck">✓</span></div>
  <div class="mrow" data-m="shuffle"><span class="mk">🔀</span>随机播放<span class="mck">✓</span></div>
</div>

<audio id="player" preload="metadata" playsinline></audio>

<!-- HLS 播放核心：改用同源本地文件（原来走 jsdelivr CDN，413 KB 实测要 10 秒才能下完；
     一旦超时或断流 window.Hls 就是 undefined，Chrome 又不能原生播 HLS → 歌直接放不出来） -->
<script src="./hls.min.js"></script>
<script>
const API = 'https://nfc-tap.maomao1ovo1.workers.dev';

// 曲目表（2026-09-18 修正：切片当初是按「文件名字典序」扫的 —— 电脑排序是 1 → 10 → 2 → 3 …
// 所以「切片编号 n」跟「专辑曲序」并不一致，必须逐首写死；之前按 i+1 硬推，第 2 首起名字全体错位一位。
// 每首的对应关系是用 ffprobe 时长指纹逐首比对确认的，10/10 精确吻合）
const TRACKS = [
  {n:'01', t:'见习恶魔',             a:'Buro'},     // 195.4s
  {n:'03', t:'糖果味觉',             a:'Buro'},     // 240.5s
  {n:'04', t:'假面日记',             a:'Buro'},     // 211.2s
  {n:'05', t:'暮色小诗',             a:'Rin'},      // 190.0s
  {n:'06', t:'你是我永不落空的期待',  a:'Marija'},   // 237.8s
  {n:'07', t:'Signal 信号',          a:'Rin'},      // 216.8s
  {n:'08', t:'恋爱巡航',             a:'Buro'},     // 210.0s
  {n:'09', t:'摩登时代的孤独',        a:'Rin'},      // 213.4s
  {n:'10', t:'漫漫长夜',             a:'Marija'},   // 250.4s
  {n:'02', t:'雨天诗集',             a:'Marija'}    // 237.2s
];
/* 说明：切片编号不再靠 i+1 推算，改由 TRACKS[i].n 指定（见上方修正说明） */

const $ = s => document.querySelector(s);
const player=$('#player'), bg=$('#bg');
let db=null, idx=-1, ticket=null, sigs={}, expAt=0, hls=null;
let switching=false, wantPlay=true, pendingSeek=null;   // 切歌中 / 本次加载后是否自动播 / 待恢复的进度
const SKEY='mg-state';                                  // 播放状态存档键（刷新后回到原处）
const urls={}; let dragging=false;

/* 禁止右键/长按下载入口 */
document.addEventListener('contextmenu', e=>e.preventDefault());

/* ── IndexedDB ── */
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('mutown-groove',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('files');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbGet=k=>new Promise(res=>{const t=db.transaction('files','readonly');const q=t.objectStore('files').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);});
const dbPut=(k,v)=>new Promise(res=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=()=>res();});
const dbKeys=()=>new Promise(res=>{const t=db.transaction('files','readonly');const q=t.objectStore('files').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);});

/* ══════ 离线缓存（加密版 · 2026-09-18 毛毛要求「一定要加密，拼不回去的那种」）══════
   ① 密钥由浏览器 WebCrypto 现场生成，且标记【不可导出】(extractable=false)：
      它只以加密形态躺在浏览器数据里 —— 就算有人 root 手机、把整个浏览器目录整个扒走，
      也拿不到密钥本身 ⇒ 密文解不开，也就拼不回音频。（密钥只在本机、只在这个浏览器里）
   ② 分片下载后 AES-GCM 加密再落盘；播放时本地解密后喂给播放器，听感没有差别。
   ③ 断网时由自定义 loader 直接从本地取，完全不碰网络。 */
const KKEY='__aes_key';
let aesKey=null;
async function getKey(){
  if(aesKey) return aesKey;
  let k=null;
  try{ k=await dbGet(KKEY); }catch(e){}
  if(!k || !(k instanceof CryptoKey)){
    k=await crypto.subtle.generateKey({name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
    await dbPut(KKEY, k);
  }
  aesKey=k; return k;
}
async function encBuf(buf){                      // 前 12 字节随机 IV + 密文
  const key=await getKey();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, buf);
  const out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
  return out.buffer;
}
async function decBuf(buf){
  const key=await getKey();
  const u8=new Uint8Array(buf);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)}, key, u8.subarray(12));
}
const segKeyOf = url => { const m=/\/hls\/(\d\d)\/([^?]+)/.exec(url); return m ? 'seg/'+m[1]+'/'+m[2] : null; };

/* 下载队列：连点多首时排队跑，避免几十个请求一起挤（这条链路一次请求要好几秒） */
const dlQueue=[]; let dlBusy=null;
function queueSong(i){
  if(dlBusy===i || dlQueue.includes(i)) return;
  dlQueue.push(i); pumpQueue();
}
async function pumpQueue(){
  if(dlBusy!==null || !dlQueue.length) return;
  dlBusy = dlQueue.shift();
  await cacheSong(dlBusy);
  dlBusy = null;
  await renderRows();
  if(dlQueue.length) pumpQueue();
}

/* 把整首（索引 + 全部分片）加密存到手机；已经存过的分片自动跳过，所以中断后再点是「续传」 */
async function cacheSong(i){
  const song=TRACKS[i].n, tip=$('#tip'), nth=TRACKS.findIndex(t=>t.n===song)+1;
  if(!await ensureTicket()){ tip.textContent='连不上服务器，等有网了再点'; return; }
  try{
    const url=API+'/hls/'+song+'/index.m3u8?t='+encodeURIComponent(ticket)+'&s='+encodeURIComponent(sigs[song]||'');
    const txt=await (await fetch(url)).text();
    if(!txt.startsWith('#EXTM3U')){ tip.textContent='取索引失败，稍后再点一次'; return; }
    const segs=txt.split('\n').map(x=>x.trim()).filter(x=>x && !x.startsWith('#') && segKeyOf(x));
    await dbPut('m3u8/'+song, txt);                       // 索引留着，断网时靠它起播
    let done=0, bad=0;
    const queue=segs.slice();
    const one=async u=>{
      const k=segKeyOf(u);
      try{
        if(!await dbGet(k)){                              // 已存过的跳过 → 天然支持续传
          let ok=false;
          for(let t=0; t<3 && !ok; t++){                  // 每片最多试 3 次
            try{
              const r=await fetch(u);
              if(r.ok){ await dbPut(k, await encBuf(await r.arrayBuffer())); ok=true; }
            }catch(err){}
            if(!ok) await new Promise(r=>setTimeout(r, 700));
          }
          if(!ok) bad++;
        }
      }catch(err){ bad++; }
      done++;
      tip.textContent='正在存到手机… 第 '+nth+' 首 '+done+'/'+segs.length+' 片';
    };
    // 5 路并发：一片就要好几秒，串行下太慢；但也不能开太宽，否则互相挤
    await Promise.all(Array.from({length:5}, async ()=>{ while(queue.length) await one(queue.shift()); }));
    await renderRows();
    tip.textContent = bad===0 ? '✅ 第 '+nth+' 首已完整存好（断网也能听）'
                              : '第 '+nth+' 首存了 '+(segs.length-bad)+'/'+segs.length+' 片，再点一次 ⬇ 会接着补';
  }catch(err){ tip.textContent='存的时候出错了，稍后再点一次'; }
}

/* ── 票据 ── */
async function ensureTicket(){
  if(ticket && Date.now()<expAt) return true;
  try{ const r=await fetch(API+'/api/ticket'); if(!r.ok) return false;
       const j=await r.json(); ticket=j.ticket; sigs=j.sigs||{}; expAt=Date.now()+(j.ttl-120)*1000; return true;
  }catch(e){ return false; }
}

/* ── 渲染当前曲目信息 ── */
function paint(){
  const tr = TRACKS[idx] || TRACKS[0];
  $('#song').textContent = tr.t;
  $('#artist').textContent = tr.a;
  mediaMeta();   // 同步给系统：锁屏 / 通知栏的封面、歌名、播放状态
  // 音柱（正在播放的跳动标记）跟着当前曲目走
  // 2026-09-18 修：原来音柱只在首次渲染时插进对应项，之后切歌不再重建 → 它永远停在老位置
  document.querySelectorAll('#rows .row').forEach((r,k)=>{
    const cur = (k===idx);
    r.classList.toggle('on', cur);
    let eq = r.querySelector('.eq');
    if(cur && !eq){
      eq = document.createElement('span'); eq.className='eq';
      eq.innerHTML = '<i></i><i></i><i></i>';
      r.appendChild(eq);
    } else if(!cur && eq){ eq.remove(); }
  });
}

/* ── 播放 ── */
/* 建 HLS 实例（只建一次；之后切歌只 loadSource，不再销毁重建 —— 省掉卡顿和一次黑屏）
   缓冲特意调大：默认只预缓冲 30 秒，弱网或切后台时一断就容易停。 */
function initHls(){
  // 自定义 loader：分片先查本地（解密后交给播放器），本地没有才走网络
  const Base = Hls.DefaultConfig.loader;
  function OffLoader(cfg){ Base.call(this, cfg); }
  OffLoader.prototype = Object.create(Base.prototype);
  OffLoader.prototype.load = function(context, config, callbacks){
    const self=this, goNet=()=>Base.prototype.load.call(self, context, config, callbacks);
    const k = segKeyOf(context.url);
    if(!k) return goNet();
    dbGet(k).then(rec=>{
      if(!rec) return goNet();
      decBuf(rec).then(buf=>callbacks.onSuccess({ url:context.url, data:buf, code:200 }, context, null)).catch(goNet);
    }).catch(goNet);
  };
  hls = new Hls({
    enableWorker: true, loader: OffLoader,
    maxBufferLength: 60, maxMaxBufferLength: 120,
    maxBufferSize: 60*1000*1000, backBufferLength: 30,
  });
  hls.attachMedia(player);
  hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ switching=false; if(wantPlay) player.play().catch(()=>{}); });
  hls.on(Hls.Events.ERROR, (ev, data)=>{
    if(!data || !data.fatal) return;
    switching = false;
    if(data.type === Hls.ErrorTypes.NETWORK_ERROR){ $('#tip').textContent='网络不稳，正在重连…'; hls.startLoad(); }
    else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
    else { $('#tip').textContent='这一首暂时放不出来，换一首试试'; }
  });
}

async function playIdx(i, autoplay=true, seekTo=null){
  if(i<0||i>=TRACKS.length) return;
  idx=i; paint();
  if(seekTo!=null) pendingSeek = seekTo;
  const song = TRACKS[i].n;

  // ① 手机里已经存过这首 → 直接用本地那份（断网能听，也不吃网络延迟）
  try{
    const localM3U8 = await dbGet('m3u8/'+song);
    if(localM3U8 && window.Hls && Hls.isSupported()){
      wantPlay = autoplay; switching = true;
      if(!hls) initHls();
      hls.loadSource(URL.createObjectURL(new Blob([localM3U8], { type:'application/vnd.apple.mpegurl' })));
      return;
    }
  }catch(e){}

  // ② 在线：走 Worker 加密分片
  if(navigator.onLine && await ensureTicket()){
    const url = API+'/hls/'+song+'/index.m3u8?t='+encodeURIComponent(ticket)+'&s='+encodeURIComponent(sigs[song]||'');
    if(window.Hls && Hls.isSupported()){
      wantPlay = autoplay; switching = true;
      if(!hls) initHls();
      hls.loadSource(url);
      return;
    }
    player.src = url; if(autoplay) player.play().catch(()=>{});
    return;
  }
  // 连不上服务器：本地那份能用就用，否则如实提示
  if(!urls[i]){ const b=await dbGet(song); if(b) urls[i]=URL.createObjectURL(b); }
  if(urls[i]){ player.src=urls[i]; if(autoplay) player.play().catch(()=>{}); }
  else { $('#tip').textContent='⚠️ 现在连不上服务器，等有网了再点一下播放'; }
}

/* ── 进度条 ── */
const fmt=s=>{ if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60), x=Math.floor(s%60);
  return m+':'+String(x).padStart(2,'0'); };
function tickUI(){
  if(dragging) return;
  const d=player.duration||0, c=player.currentTime||0;
  const p = d? (c/d*100):0;
  $('#fill').style.width = p+'%';
  $('#knob').style.left  = p+'%';
  $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
}
player.addEventListener('timeupdate', tickUI);
player.addEventListener('loadedmetadata', tickUI);
player.addEventListener('durationchange', tickUI);
player.addEventListener('ended', ()=>{ const n=nextIdx(); if(n>=0) playIdx(n); });
/* 新流加载完成后，把上次的位置接回去（刷新页面也能接着听） */
player.addEventListener('loadedmetadata', ()=>{
  if(pendingSeek!=null){ try{ player.currentTime = pendingSeek; }catch(e){} pendingSeek=null; }
});
player.addEventListener('play', ()=>{ $('#playIcon').innerHTML='<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
  $('#cover').classList.add('playing'); mediaMeta(); mediaState('playing'); saveState(); });
player.addEventListener('pause',()=>{ $('#playIcon').innerHTML='<path d="M7 5v14l12-7z"/>';
  $('#cover').classList.remove('playing');
  if(!switching){ mediaMeta(); mediaState('paused'); }   // 切歌中的 pause 不算数，免得系统卡片闪
  saveState(); });

/* ── 记住播放状态：刷新 / 重开页面后回到同一首、同一进度 ── */
let saveTick=0;
function saveState(){
  if(idx<0) return;
  try{
    localStorage.setItem(SKEY, JSON.stringify({ i:idx, t:player.currentTime||0, p:!player.paused, at:Date.now() }));
  }catch(e){}
}
player.addEventListener('timeupdate', ()=>{ const n=Date.now(); if(n-saveTick>3000){ saveTick=n; saveState(); } });
window.addEventListener('pagehide', saveState);

/* 拖动进度：拖动过程只更新界面（不 seek，避免卡），松手那一刻才真正跳 */
const bar=$('#bar');
let pendingRatio = 0;
const ratioOf = e => { const r=bar.getBoundingClientRect();
  const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  return Math.max(0, Math.min(1, (cx - r.left) / r.width)); };
function paintBar(p){
  $('#fill').style.width = (p*100)+'%';
  $('#knob').style.left  = (p*100)+'%';
  if(isFinite(player.duration) && player.duration>0) $('#cur').textContent = fmt(p*player.duration);
}
bar.addEventListener('pointerdown', e=>{
  dragging = true; bar.classList.add('active');
  try{ bar.setPointerCapture(e.pointerId); }catch(_){}
  pendingRatio = ratioOf(e); paintBar(pendingRatio); e.preventDefault();
});
bar.addEventListener('pointermove', e=>{
  if(!dragging) return;
  pendingRatio = ratioOf(e); paintBar(pendingRatio); e.preventDefault();
});
const endSeek = () => {
  if(!dragging) return;
  dragging = false; bar.classList.remove('active');
  if(isFinite(player.duration) && player.duration>0){ player.currentTime = pendingRatio * player.duration; }
  tickUI();
};
bar.addEventListener('pointerup', endSeek);
bar.addEventListener('pointercancel', endSeek);

/* ── 四种模式 ── */
const MODES=['all','one','shuffle','order'];
const MODE_TXT={order:'➡️ 顺序播放',all:'🔁 列表循环',one:'🔂 单曲循环',shuffle:'🔀 随机播放'};
let mode=localStorage.getItem('mg-mode')||'all'; if(!MODES.includes(mode)) mode='all';
const applyMode=()=>{ $('#modeChip').textContent=MODE_TXT[mode]; localStorage.setItem('mg-mode',mode);
  // 面板里把当前模式点亮（打开面板就知道现在是哪个）
  document.querySelectorAll('#modePanel .mrow').forEach(r=>r.classList.toggle('on', r.dataset.m===mode)); };
function nextIdx(){
  if(mode==='one') return idx;
  if(mode==='shuffle'){ if(TRACKS.length<2) return idx; let n; do{n=Math.floor(Math.random()*TRACKS.length);}while(n===idx); return n; }
  const nx=idx+1; if(nx<TRACKS.length) return nx; return mode==='all'?0:-1;
}
/* ══════ 系统能力接入（2026-09-18 毛毛要求）══════
   说明：真正的「灵动胶囊 / 流体云 / 实时活动」是系统发给**原生 App** 的能力，
   网页（浏览器里的一个网址）申请不到，这点没法绕。
   这里接的是网页确实能接的那一项系统能力（画中画那一套毛毛说没用，已按他要求删除）： */

/* ① 系统媒体控制（Media Session API）—— 锁屏 / 通知栏 / 蓝牙耳机
   接上之后：系统把本页当成一个正经音乐播放器 —— 锁屏和通知栏会显示封面 + 歌名，
   并且能直接暂停 / 上一首 / 下一首 / 拖进度；切到后台或锁屏也不会断。 */
function mediaMeta(){
  if(!('mediaSession' in navigator)) return;
  const tr = TRACKS[idx] || TRACKS[0];
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: tr.t, artist: tr.a, album: 'Mutown Grooove',
      artwork: [{ src:'./cover.jpg', sizes:'512x512', type:'image/jpeg' }]
    });
  }catch(e){}
}
/* 播放状态单独更新：切歌过程里不去碰它，锁屏 / 灵动胶囊那块才不会「闪一下消失再出现」 */
function mediaState(s){
  if(!('mediaSession' in navigator)) return;
  try{ navigator.mediaSession.playbackState = s; }catch(e){}
}
if('mediaSession' in navigator){
  const ms = navigator.mediaSession;
  const on = (a,f)=>{ try{ ms.setActionHandler(a,f); }catch(e){} };   // 个别机型不支持某些动作，忽略即可
  on('play',          ()=>player.play().catch(()=>{}));
  on('pause',         ()=>player.pause());
  on('previoustrack', ()=>playIdx(idx<=0 ? TRACKS.length-1 : idx-1));
  on('nexttrack',     ()=>{ const n=nextIdx(); playIdx(n>=0?n:0); });
  on('seekbackward',  ()=>{ player.currentTime = Math.max(0, player.currentTime-10); });
  on('seekforward',   ()=>{ player.currentTime = Math.min(player.duration||0, player.currentTime+10); });
  on('seekto',        e=>{ if(e.seekTime!=null) player.currentTime = e.seekTime; });
}


/* ── 播放模式面板（2026-09-18 毛毛要求）──
   原来点模式按钮只能「循环盲切」四种模式，看不出有哪几种、也看不出当前是哪个；
   现在改成点一下弹出菜单，四种模式直接选。 */
const modePanel=$('#modePanel');
const openMode=o=>{ if(o) sheet.classList.remove('open');
  modePanel.classList.toggle('open',o);
  mask.classList.toggle('on', o || sheet.classList.contains('open')); };
$('#modeBtn').onclick = $('#modeChip').onclick = ()=>openMode(true);
modePanel.querySelectorAll('.mrow').forEach(r=>{
  r.onclick = ()=>{ mode = r.dataset.m; applyMode(); openMode(false); };
});

/* ── 按钮 ── */
$('#play').onclick = ()=>{ if(idx<0){ playIdx(0); return; }
  if(player.paused) player.play().catch(()=>{}); else player.pause(); };
$('#next').onclick = ()=>{ const n=nextIdx(); playIdx(n>=0?n:0); };
$('#prev').onclick = ()=>{ const p = idx<=0 ? TRACKS.length-1 : idx-1; playIdx(p); };

/* ── 列表抽屉 ── */
const sheet=$('#sheet'), mask=$('#mask');
const openSheet=o=>{ if(o) modePanel.classList.remove('open');
  sheet.classList.toggle('open',o);
  mask.classList.toggle('on', o || modePanel.classList.contains('open')); };
$('#listBtn').onclick = ()=>openSheet(true);
mask.onclick = ()=>{ openSheet(false); openMode(false); };

/* ── 列表渲染 ── */
/* 每首到底存全了没有：拿「已存分片数」和「索引里的分片数」比，别只看索引在不在 */
async function storedState(){
  const keys = await dbKeys();
  const have = {};
  keys.forEach(k=>{ const m=/^seg\/(\d\d)\//.exec(String(k)); if(m) have[m[1]]=(have[m[1]]||0)+1; });
  const out = {};
  for(const tr of TRACKS){
    const txt = await dbGet('m3u8/'+tr.n);
    if(!txt){ out[tr.n]={s:'none'}; continue; }
    const need = String(txt).split('\n').filter(l=>l.trim() && !l.trim().startsWith('#')).length;
    const got = have[tr.n]||0;
    out[tr.n] = { s: got>=need ? 'full' : 'part', got, need };
  }
  return out;
}
async function renderRows(){
  const st = await storedState();
  $('#rows').innerHTML='';
  TRACKS.forEach((tr,i)=>{
    const d=document.createElement('div'); d.className='row'+(i===idx?' on':'');
    d.innerHTML='<span class="no">'+(i+1)+'</span>'+
      '<div style="flex:1;min-width:0"><div class="nm">'+tr.t+'</div><div class="who">'+tr.a+'</div></div>'+
      (i===idx?'<span class="eq"><i></i><i></i><i></i></span>':'')+
      (()=>{ const s=st[TRACKS[i].n]||{s:'none'};
        return s.s==='full' ? '<span class="dl on">✓</span>'
             : s.s==='part' ? '<span class="dl part">◐</span>'
             : '<span class="dl">⬇</span>'; })();
    d.onclick=()=>{ playIdx(i); openSheet(false); };
    d.querySelector('.dl').onclick=(ev)=>{ ev.stopPropagation(); queueSong(i); };
    $('#rows').appendChild(d);
  });
  $('#tip').textContent = '贴一下 NFC 挂件打开本页 · 点 ▶ 开播 · 放完自动下一首';
}

/* ── 播放列表抽屉入口（2026-09-18 按毛毛要求：离线缓存整块删除 —— 本页只在线听、不提供下载）── */
$('#listChip').onclick = ()=>openSheet(true);

/* ── 启动 ── */
(async function(){
  try{ db=await openDB(); }catch(e){}
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){} }
  applyMode(); await renderRows(); paint();
  ensureTicket();
  // 接着上次听：曲目 + 进度都恢复（浏览器不允许自动播时，就只回到那个位置，点一下继续）
  let st=null; try{ st = JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){}
  if(st && Number.isInteger(st.i) && st.i>=0 && st.i<TRACKS.length){
    idx = st.i; paint();
    playIdx(st.i, !!st.p, (st.t && st.t>5) ? st.t : null);
  }
})();
</script>
